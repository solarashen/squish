<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>squish · compare</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Onest:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#141418;--muted:#4f5260;--pink:#ff8fc7;--lemon:#ffe66d;--mint:#b8f0d0;--bg:#f7f7f9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 Onest,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:26px 48px 0}
.logo{font:800 38px/1 "Baloo 2"}.logo i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pink)}
.clay{border-radius:999px;box-shadow:inset -3px -4px 7px rgba(0,0,0,.12),inset 3px 3px 6px rgba(255,255,255,.75),0 4px 10px rgba(20,20,24,.12)}
.pill{background:#fff;padding:8px 16px;font-weight:600}
.r{margin-left:auto;display:flex;gap:8px}.ink{background:var(--ink);color:#fff}
.wrap{display:grid;grid-template-columns:1fr 380px;gap:28px;padding:22px 48px}
/* your own photo is the hero: a split view, original left, squished right */
.viewer{position:relative;height:610px;border-radius:32px;overflow:hidden}
.photo{position:absolute;inset:0;background:
 radial-gradient(circle at 70% 30%,#fff3c4 0 60px,#ffd27a 61px 75px,transparent 76px),
 linear-gradient(180deg,#8ec5ff 0%,#c9e4ff 42%,#2c7fb8 43%,#1b5f8f 70%,#e8d3a8 71%,#d9bf8c 100%)}
.photo::after{content:"";position:absolute;left:8%;right:40%;top:30%;height:14%;background:#3f6b4e;border-radius:60% 70% 0 0}
.after{position:absolute;inset:0 0 0 58%;overflow:hidden}
.after .photo{left:-138%;filter:saturate(1.05) contrast(1.02)}
.split{position:absolute;top:0;bottom:0;left:58%;width:4px;margin-left:-2px;background:#fff}
.knob{position:absolute;top:50%;left:58%;width:58px;height:58px;margin:-29px 0 0 -29px;background:var(--pink);display:grid;place-items:center;font:800 22px "Baloo 2"}
.lab{position:absolute;top:22px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);font-weight:600;font-size:14px}
.lab b{font:800 18px "Baloo 2";margin-right:6px}
.loupe{position:absolute;left:62%;top:58%;width:170px;height:170px;border-radius:50%;border:5px solid #fff;box-shadow:0 14px 30px rgba(20,20,24,.3);overflow:hidden;background:
 repeating-linear-gradient(0deg,#1b5f8f 0 6px,#236d9f 6px 12px),#1b5f8f}
.loupe::after{content:"4×";position:absolute;right:16px;bottom:14px;font:800 15px "Baloo 2";color:#fff}
.verdict{position:absolute;left:22px;bottom:22px;display:flex;gap:10px;align-items:center;padding:12px 18px;border-radius:20px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);font-weight:600}
.verdict i{width:12px;height:12px;border-radius:50%;background:#2a9d63}
.strip{display:flex;gap:12px;margin-top:18px;align-items:center}
.th{width:96px;height:72px;border-radius:16px;flex:none;position:relative}
.th.on{outline:3px solid var(--ink);outline-offset:3px}
.th b{position:absolute;right:6px;bottom:6px;font:800 13px "Baloo 2";background:#fff;border-radius:999px;padding:0 7px}
.add{width:96px;height:72px;border-radius:16px;border:2.5px dashed rgba(20,20,24,.3);display:grid;place-items:center;font:800 26px "Baloo 2";color:var(--muted)}
.hint{margin-left:12px;color:var(--muted);font-size:14px}
.panel{background:#fff;border-radius:32px;padding:28px;border:1px solid rgba(20,20,24,.08);display:flex;flex-direction:column;gap:18px}
.panel h2{font:800 22px "Baloo 2"}
.big{font:800 92px/.9 "Baloo 2";letter-spacing:-.03em}.big span{display:inline-block;line-height:.95;background:var(--lemon);border-radius:18px;padding:12px 14px 0}
.mut{color:var(--muted)}
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:8px}
.seg{display:flex;gap:6px}.seg b{flex:1;text-align:center;padding:9px 0;background:#fff;font-weight:600}.seg b.on{background:var(--ink);color:#fff}
.sl{height:14px;border-radius:7px;background:rgba(20,20,24,.08);position:relative}.sl::before{content:"";position:absolute;inset:0 22% 0 0;border-radius:7px;background:var(--mint)}.sl::after{content:"";position:absolute;left:78%;top:-9px;width:32px;height:32px;border-radius:50%;background:var(--pink);margin-left:-16px;box-shadow:inset -4px -5px 8px rgba(0,0,0,.14),0 4px 10px rgba(20,20,24,.2)}
.dl{margin-top:auto;text-align:center;padding:16px;background:var(--ink);color:#fff;font:800 18px "Baloo 2"}
</style>
</head>
<body>
<header><div class="logo">squish<i></i></div><span class="pill clay" style="margin-left:20px">How it works</span><span class="pill clay">About</span><div class="r"><span class="pill clay ink">EN</span><span class="pill clay">HR</span></div></header>
<div class="wrap">
 <section>
  <div class="viewer">
   <div class="photo"></div>
   <div class="after"><div class="photo"></div></div>
   <div class="split"></div>
   <div class="knob clay">⟷</div>
   <span class="lab" style="left:22px"><b>Original</b>JPG · 6.8 MB</span>
   <span class="lab" style="right:22px"><b>Squished</b>WebP · 1.4 MB</span>
   <div class="loupe"></div>
   <div class="verdict"><i></i>Looks the same to the eye · 79% smaller</div>
  </div>
  <div class="strip">
   <div class="th on" style="background:linear-gradient(180deg,#8ec5ff,#2c7fb8 55%,#d9bf8c)"><b>−79%</b></div>
   <div class="th" style="background:linear-gradient(200deg,#e8c27a,#b5562e)"><b>−71%</b></div>
   <div class="th" style="background:linear-gradient(180deg,#f5d0d6,#c46a7c)"><b>−79%</b></div>
   <div class="add">+</div>
   <span class="hint">Drag the handle to compare. Drop more files anywhere.</span>
  </div>
 </section>
 <aside class="panel">
  <h2>Your images</h2>
  <div class="big"><span>−76%</span></div>
  <p class="mut">17.8 MB → 4.4 MB · 3 files</p>
  <div><label>Convert to</label><div class="seg"><b class="clay">JPEG</b><b class="clay on">WebP</b><b class="clay">PNG</b></div></div>
  <div><label>Quality · 78</label><div class="sl"></div></div>
  <div><label>Max width</label><div class="seg"><b class="clay">Original</b><b class="clay on">1920</b><b class="clay">1280</b></div></div>
  <span class="dl clay">Download all (.zip)</span>
 </aside>
</div>
</body>
</html>
